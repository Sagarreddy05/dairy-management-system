services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: dairy
      POSTGRES_PASSWORD: dairy123
      POSTGRES_DB: dairy_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - db
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://dairy:dairy123@db:5432/dairy_db?schema=public
      JWT_SECRET: change-me-in-production
    volumes:
      - ./uploads:/app/uploads

volumes:
  pgdata:
